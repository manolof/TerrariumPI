# Builds the slim image for Ludwig's enclosure, smoke-tests it, and pushes it only if the test passes.
name: Ludwig image

on:
  push:
    branches:
      - ludwig
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/manolof/terrariumpi

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Short sha
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ludwig
          platforms: linux/arm/v7
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ludwig-${{ steps.vars.outputs.sha }}

      - name: Image size
        run: docker image ls "${IMAGE}:ludwig-${{ steps.vars.outputs.sha }}"

      - name: Smoke test
        env:
          SMOKE_TIMEOUT: "600"
        run: python3 tests/smoke/smoke.py "${IMAGE}:ludwig-${{ steps.vars.outputs.sha }}" --platform linux/arm/v7

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/ludwig'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (only after the smoke test passed)
        if: github.ref == 'refs/heads/ludwig'
        run: docker push "${IMAGE}:ludwig-${{ steps.vars.outputs.sha }}"
